name: ${COMPOSE_PROJECT_NAME:-glipz-production}

x-service: &service
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *service
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      GLIPZ_DOMAIN: ${GLIPZ_DOMAIN:?Set your public domain in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set an operator email in .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {}
      proxy:
        ipv4_address: ${GLIPZ_PROXY_IP:-10.245.92.2}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    <<: *service
    image: ${GLIPZ_IMAGE:-glipz:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://glipz:${POSTGRES_APP_PASSWORD:?Generate a database password}@postgres:5432/glipz?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?Generate a Redis password}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Generate a JWT secret}
      GLIPZ_FEDERATION_KEY_SEED: ${GLIPZ_FEDERATION_KEY_SEED:?Generate a federation seed}
      FRONTEND_ORIGIN: https://${GLIPZ_DOMAIN:?Set your public domain}
      GLIPZ_PROTOCOL_PUBLIC_ORIGIN: https://${GLIPZ_DOMAIN:?Set your public domain}
      GLIPZ_PROTOCOL_HOST: ${GLIPZ_DOMAIN:?Set your public domain}
      STATIC_WEB_ROOT: /app/web/dist
      GLIPZ_STORAGE_MODE: ${GLIPZ_STORAGE_MODE:-local}
      GLIPZ_LOCAL_STORAGE_PATH: /app/data/media
      LEGAL_DOCS_DIR: /app/data/legal-docs
      GLIPZ_TRUST_PROXY_HEADERS: "true"
      GLIPZ_TRUSTED_PROXY_CIDRS: ${GLIPZ_PROXY_IP:-10.245.92.2}/32
      GLIPZ_AUTH_RATE_LIMIT_FAIL_CLOSED: "true"
      GLIPZ_REMOTE_MEDIA_PROXY_RATE_LIMIT_FAIL_CLOSED: "true"
      GLIPZ_LINK_PREVIEW_RATE_LIMIT_FAIL_CLOSED: "true"
      GLIPZ_FEDERATION_INBOX_RATE_LIMIT_FAIL_CLOSED: "true"
      GLIPZ_METRICS_ENABLED: "false"
      SMTP_HOST: ${SMTP_HOST:?Configure a real SMTP provider}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Set the verified sender email}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Glipz}
      GLIPZ_ADMIN_USER_IDS: ${GLIPZ_ADMIN_USER_IDS:-}
      FEDERATION_POLICY_SUMMARY: ${FEDERATION_POLICY_SUMMARY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-false}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      PATREON_ENABLED: ${PATREON_ENABLED:-false}
      PATREON_CLIENT_ID: ${PATREON_CLIENT_ID:-}
      PATREON_CLIENT_SECRET: ${PATREON_CLIENT_SECRET:-}
      PATREON_REDIRECT_URI: ${PATREON_REDIRECT_URI:-}
    read_only: true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    volumes:
      - media_data:/app/data/media
      - ./data/legal-docs:/app/data/legal-docs:ro
    networks:
      proxy:
        ipv4_address: ${GLIPZ_BACKEND_PROXY_IP:-10.245.92.3}
      database: {}
      app_egress: {}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: glipz
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Generate a database admin password}
      GLIPZ_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Generate a database app password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-production.sh:/docker-entrypoint-initdb.d/01-glipz.sh:ro
      - ./infra/postgres/init.sql:/opt/glipz/init.sql:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d glipz"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    <<: *service
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Generate a Redis password}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Generate a Redis password}
    volumes: [redis_data:/data]
    networks: [database]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  edge: {}
  app_egress: {}
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${GLIPZ_PROXY_SUBNET:-10.245.92.0/24}
  database:
    internal: true

volumes:
  pgdata:
  redis_data:
  media_data:
  caddy_data:
  caddy_config:
